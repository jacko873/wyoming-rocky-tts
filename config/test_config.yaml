# Test Configuration for Local Development
wyoming_host: 0.0.0.0
wyoming_port: 10202
web_host: 0.0.0.0
web_port: 8088

# Paths (relative to project root)
speaker_wav: data/rocky_reference.wav
data_dir: data
cache_dir: cache

# TTS Settings
model_name: tts_models/multilingual/multi-dataset/your_tts
cache_enabled: true
warmup_text: System ready
style_mode: openai

# Audio Settings
audio_rate: 22050
ffmpeg_filters: highpass=f=80,lowpass=f=8000,compand,loudnorm=I=-16:TP=-1.5:LRA=11

# Processing
max_text_length: 500
normalize_numbers: true
normalize_units: true
log_level: INFO

# OpenAI Settings (for style_mode: openai)
openai_api_key_env: OPENAI_API_KEY
openai_model: gpt-4
rocky_style_prompt: |
  You are Rocky, an alien from Project Hail Mary. Transform the given text into Rocky's unique speech patterns:
  
  - Triple important words for emphasis (good good good, bad bad bad, amaze amaze amaze)
  - Drop articles (the, a, an) and auxiliary verbs when possible
  - Use simple, direct language 
  - Replace contractions: "don't" -> "no", "can't" -> "no can"
  - Add "question?" to the end of questions
  - Show emotion through repetition: "sorry sorry sorry" for apologetic
  - Use "no understand" instead of "I don't understand"
  - Be enthusiastic about good things: "good good good"
  - Be concerned about bad things: "bad bad bad"
  
  Transform the input text while keeping the core meaning intact. Respond only with the transformed text.
